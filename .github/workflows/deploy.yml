name: Deploy backend

# Redeploys the backend whenever backend code lands on main, so a merged fix (like the
# Cognito-authorizer or role-lookup bugs documented in docs/qa/defect-reports.md) doesn't
# sit undeployed until someone remembers to run `syndicate update` by hand - see
# docs/deployment.md for the equivalent manual steps this automates.

on:
  push:
    branches: [main]
    paths:
      - 'backend/restaurant-backend-app/**'
  workflow_dispatch:
    inputs:
      full_deploy:
        description: 'Run "syndicate deploy" (new/changed AWS resources) instead of "syndicate update" (Lambda code only)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  BACKEND_DIR: backend/restaurant-backend-app
  SYNDICATE_DEPLOY_NAME: dev
  AWS_REGION: eu-north-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: ${{ env.BACKEND_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and test before touching anything deployed
        run: |
          dotnet restore restaurant-backend-app.sln
          dotnet build restaurant-backend-app.sln --no-restore
          dotnet test restaurant-backend-app.sln --no-build

      - name: Set up Python (Syndicate is a Python CLI)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install aws-syndicate
        run: pip install aws-syndicate

      # Static IAM user credentials, not OIDC: this AWS account's Organizations SCP blocks
      # iam:CreateOpenIDConnectProvider/CreateRole for the deploy user, so a short-lived OIDC
      # role isn't an option here. Set AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY as repository
      # secrets (Settings -> Secrets and variables -> Actions -> Secrets) from the same IAM user
      # (marathon-deployer) already used for manual deploys - see docs/deployment.md.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # The .syndicate-config-restaurant-backend-app/ directory is gitignored on purpose (it
      # holds the real AWS account id - see the Secrets hygiene item in README's Security
      # section), so it never reaches the CI checkout. Generate it here instead, from the AWS
      # identity the previous step just authenticated as, plus the bucket-naming convention
      # docs/deployment.md documents for setting this up by hand.
      - name: Generate Syndicate config
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          CONFIG_DIR="$(pwd)/.syndicate-config-restaurant-backend-app"
          mkdir -p "$CONFIG_DIR"

          printf '%s\n' \
            "account_id: \"$ACCOUNT_ID\"" \
            "region: ${{ env.AWS_REGION }}" \
            "project_path: \"$(pwd)\"" \
            "deploy_target_bucket: \"marathon2026-restaurant-artifacts-$ACCOUNT_ID\"" \
            > "$CONFIG_DIR/syndicate.yml"

          printf '%s\n' \
            "account_id: \"$ACCOUNT_ID\"" \
            "region: ${{ env.AWS_REGION }}" \
            "lambdas_alias_name: \"${{ env.SYNDICATE_DEPLOY_NAME }}\"" \
            "logs_expiration: 30" \
            "" \
            "api_gateway_name: \"restaurant-backend-api\"" \
            "user_pool_name: \"restaurant-backend-user-pool\"" \
            "reports_queue_name: \"restaurant-reports-queue\"" \
            "" \
            "waiter_list_table_name: \"Waiters\"" \
            "feedback_table_name: \"Feedback\"" \
            "locations-table: \"Locations\"" \
            "tables_table: \"Tables\"" \
            "dishes-table: \"Dishes\"" \
            "reservations-table: \"Reservations\"" \
            "orders-table: \"Orders\"" \
            "reports_table_name: \"Reports\"" \
            "reports_history_table_name: \"ReportsHistory\"" \
            "profile_images_table_name: \"ProfileImages\"" \
            "notifications_table_name: \"Notifications\"" \
            "" \
            "waiters_global_index: \"locationId-index\"" \
            "feedback_global_index: \"locationId-createdAt-index\"" \
            "tables-locationId-global-index: \"locationId-tableNumber-index\"" \
            "reservations-table-global-index: \"GSI_ByTableId\"" \
            "reservations-customerId-global-index: \"GSI_UserId\"" \
            "reservations-waiterId-global-index: \"GSI_WaiterId\"" \
            "orders_index_reservationid: \"GSI_ReservationId\"" \
            "notifications_userId-global-index: \"UserIdIndex\"" \
            "" \
            "imagesBucketName: \"restaurant-backend-dev-images-$ACCOUNT_ID\"" \
            "profileImagesBucketName: \"restaurant-backend-dev-profile-images-$ACCOUNT_ID\"" \
            "swagger_ui_hoster_bucket_name: \"restaurant-backend-dev-swagger-ui-$ACCOUNT_ID\"" \
            "email_from: \"\"" \
            > "$CONFIG_DIR/syndicate_aliases.yml"

      - name: Syndicate build
        run: |
          export SDCT_CONF="$(pwd)/.syndicate-config-restaurant-backend-app"
          syndicate build

      - name: Syndicate deploy or update
        run: |
          export SDCT_CONF="$(pwd)/.syndicate-config-restaurant-backend-app"
          if [ "${{ inputs.full_deploy }}" = "true" ]; then
            syndicate deploy --deploy_name "$SYNDICATE_DEPLOY_NAME" --replace_output
          else
            # Reservations is excluded: Syndicate's DynamoDB update path chokes on it
            # (AttributeError: 'NoneType' object has no attribute 'get') - same workaround
            # already used for manual local deploys, see docs/deployment.md.
            syndicate update --deploy_name "$SYNDICATE_DEPLOY_NAME" --excluded-resources Reservations --replace_output
          fi
