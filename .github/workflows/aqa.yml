name: AQA tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  aqa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aqa/RestaurantAqa.Tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Install Playwright browser
        run: pwsh bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Use real deployment config
        run: cp .env.example .env

      - name: Run tests
        run: dotnet test --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqa-test-results
          path: aqa/RestaurantAqa.Tests/TestResults
